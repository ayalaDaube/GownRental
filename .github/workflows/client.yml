name: Client

on:
  push:
    branches: [main]
    paths: ['Client/**', '.github/workflows/client.yml']
  pull_request:
    paths: ['Client/**', '.github/workflows/client.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install exactly what the lock file says
        run: npm ci

      - name: Lint (no warnings allowed)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Production build (CI=true makes any warning an error)
        run: npm run build

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: Client/coverage/lcov.info
          if-no-files-found: ignore
